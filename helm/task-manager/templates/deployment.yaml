apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-manager.fullname" . }}
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
  annotations:
    # Wave "1": Argo CD waits for the migration Job (wave "0") to reach Succeeded first, so the
    # schema is already migrated before these pods' Hibernate validate=true check runs.
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "task-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-manager.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Threat #51: pod hardening. runAsUser is an arbitrary non-root UID (base image has no named one).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
            # Actuator (probes, Prometheus scrape) on its own port; deliberately not in the Service, so
            # the ingress can't route to it (threat #17).
            - name: management
              containerPort: {{ .Values.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ include "task-manager.fullname" . }}-config
            - secretRef:
                name: {{ include "task-manager.fullname" . }}-secret
          env:
            # The migration Job (not this pod) now owns running Flyway (threat #18); this pod no
            # longer even has the SPRING_FLYWAY_* credentials to do so. Explicit env wins over
            # envFrom on a name collision, so this is a safe override regardless of defaults.
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.managementPort | quote }}
          # Startup probe absorbs the wait for Postgres/Kafka/Keycloak so the pod isn't
          # killed while dependencies come up; readiness/liveness use the app's health groups.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem needs a writable /tmp (JVM temp files + the ONNX embedding cache).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
