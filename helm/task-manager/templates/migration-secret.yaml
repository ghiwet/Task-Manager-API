{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-manager.fullname" . }}-migration-secret
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Owner-role (Flyway) credentials, kept out of the long-running app pod's Secret (threat #18):
  # only the one-shot migration Job below consumes this.
  SPRING_FLYWAY_PASSWORD: {{ .Values.secrets.flywayPassword | quote }}
{{- end }}
