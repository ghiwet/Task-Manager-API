{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-manager.fullname" . }}-secret
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ required "secrets.datasourcePassword is required (the app_rls password)" .Values.secrets.datasourcePassword | quote }}
  SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG: {{ required "secrets.kafkaSaslJaasConfig is required (the Kafka SCRAM JAAS line)" .Values.secrets.kafkaSaslJaasConfig | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.secrets.keycloakClientSecret | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
{{- end }}
