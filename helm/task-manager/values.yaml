replicaCount: 1

image:
  repository: ghcr.io/ghiwet/task-manager-api
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# For a private GHCR package, reference a pull secret here, e.g. [{ name: ghcr-creds }].
imagePullSecrets: []

service:
  type: ClusterIP
  port: 8080

# Actuator port for probes and scraping; not exposed by the Service/ingress (threat #17).
managementPort: 8091

resources:
  requests:
    cpu: 250m
    memory: 768Mi   # the in-process ONNX embedding model needs headroom
  limits:
    cpu: "1"
    memory: 1536Mi

# Non-secret config, injected as Spring env (relaxed binding). Point these at your
# in-cluster or external services.
config:
  datasourceUrl: jdbc:postgresql://postgres:5432/taskdb
  datasourceUsername: app_rls
  flywayUser: taskuser
  kafkaBootstrapServers: kafka:9092
  kafkaSecurityProtocol: SASL_PLAINTEXT
  kafkaSaslMechanism: SCRAM-SHA-512
  redisHost: redis
  redisPort: 6379
  elasticsearchUris: http://elasticsearch:9200
  keycloakBaseUrl: http://keycloak:8080
  keycloakClientId: springboot-app
  baseUrl: http://localhost:8080
  otlpTracingEndpoint: http://tempo:4318/v1/traces
  openaiChatModel: gpt-4o-mini
  # Regex of proxies trusted for X-Forwarded-For (threat #16); empty = none. E.g. "10\\.244\\.\\d+\\.\\d+"
  trustedProxies: ""

# Secrets. `create: true` renders a plaintext Secret from the values below — throwaway local-dev
# defaults, fine for `helm install`/the terraform-deploy branch. In the GitOps flow set
# `create: false`: the app's Secret is provided instead by a committed, encrypted SealedSecret
# (argocd/secrets), so no real secret is ever committed in plaintext.
secrets:
  create: true
  datasourcePassword: app_rls_pass
  # Owner-role (Flyway) password; no default, required when secrets.create=true (threat #18).
  flywayPassword: ""
  # Full JAAS config line, not just a password -- spring.kafka.properties.sasl.jaas.config embeds
  # both the username and password in one string, so the whole value has to live in the Secret.
  kafkaSaslJaasConfig: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="taskmanager-app" password="taskmanager-secret";
  keycloakClientSecret: secret123
  openaiApiKey: ""

# Probes hit Spring Boot's actuator health groups on the management port.
probes:
  startup:
    failureThreshold: 30   # ~5 min for Postgres/Kafka/Keycloak to become reachable
    periodSeconds: 10
  readiness:
    periodSeconds: 10
  liveness:
    periodSeconds: 20

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

ingress:
  enabled: false
  className: ""
  host: task-manager.local
  path: /
  pathType: Prefix
  annotations: {}
