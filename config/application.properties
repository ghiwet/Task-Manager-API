# Local-development overrides, loaded by Spring Boot from ./config when run from the repo root
# (./mvnw spring-boot:run or an IDE). Never packaged into the jar or image (threat #18).
# Flyway's owner-role credentials, matching the docker-compose Postgres.
spring.flyway.user=taskuser
spring.flyway.password=taskpass
# Runtime app_rls password; R__app_rls_password applies it to the role (not in the jar either).
spring.datasource.password=app_rls_pass
# Kafka SCRAM credential seeded by docker-compose's kafka-init.
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="taskmanager-app" password="taskmanager-secret";
