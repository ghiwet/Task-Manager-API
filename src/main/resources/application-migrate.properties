# Used by the Helm migration Job (threat #18): runs Flyway in isolation from the long-running app
# pod, which should never hold the owner-role Flyway credentials. No web server needed, and no AI
# autoconfig (matches AbstractIntegrationTest's test-side exclusion -- avoids needing an OpenAI key
# or downloading the ONNX embedding model for a job that only runs migrations).
spring.main.web-application-type=none
spring.ai.model.chat=none
spring.ai.model.embedding=none
# OAuth2ClientAutoConfiguration fires off the mere presence of spring.security.oauth2.client.*
# properties, independent of WebSecurityConfig -- its ClientRegistrationRepository bean does eager
# OIDC issuer discovery against Keycloak at bean-creation time, which would otherwise block this
# Job's startup on Keycloak being reachable.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration,\
org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration,\
org.springframework.boot.security.oauth2.client.autoconfigure.reactive.ReactiveOAuth2ClientAutoConfiguration
