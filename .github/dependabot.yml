version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/*.yml current: Dependabot reads the
  # trailing "# vX" comment, opens a PR bumping both the SHA and the comment when a new
  # release ships. Without this, a SHA pin is frozen forever once set by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A newly published action release could be malicious or unstable; waiting lets the
    # community catch that before this repo adopts it. Doesn't delay security updates.
    cooldown:
      default-days: 7
