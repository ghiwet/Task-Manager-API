name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reused by release.yml to gate publishing on the test suite

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # Stable path for the ONNX embedding model so it is cached across runs instead of being
      # re-downloaded (~90MB) each time. Overrides the application.properties default via Spring
      # relaxed binding; the env is inherited by the Surefire fork.
      SPRING_AI_EMBEDDING_TRANSFORMER_CACHE_DIRECTORY: ${{ github.workspace }}/.onnx-cache
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache ONNX embedding model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.onnx-cache
          key: spring-ai-onnx-all-MiniLM-L6-v2

      # Tests use Testcontainers (Docker is preinstalled on ubuntu-latest) and EmbeddedKafka;
      # they need no external services or secrets.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
