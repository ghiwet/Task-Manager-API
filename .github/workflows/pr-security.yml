name: PR Security Checks

# Threat #46: security.yml was workflow_dispatch-only, so nothing gated merges. This runs the fast
# checks (CodeQL, Semgrep, TruffleHog) on every PR; Dependency-Check/ZAP stay manual -- too slow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          languages: java
          build-mode: manual

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build with Maven
        run: ./mvnw clean install -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          output: sarif-results

      # analyze's exit code ignores findings -- it only uploads to the Security tab. security-severity
      # (GitHub's 0-10 CVSS-like score) lives on the rule definition, not per result, so this joins
      # result -> ruleId -> rule.properties.security-severity. >=7.0 = High/Critical.
      - name: Fail on High/Critical CodeQL findings
        run: |
          set -e
          FAIL=0
          for f in sarif-results/*.sarif; do
            [ -f "$f" ] || continue
            jq -r '
              [(.runs[].tool.driver.rules[]? ), (.runs[].tool.extensions[]?.rules[]?)]
              | .[] | [.id, (.properties."security-severity" // "0")] | @tsv
            ' "$f" > /tmp/rule-severities.tsv
            jq -r '.runs[].results[]? | .ruleId' "$f" > /tmp/result-rules.txt
            while IFS= read -r rule_id; do
              [ -z "$rule_id" ] && continue
              sev=$(awk -F'\t' -v r="$rule_id" '$1 == r {print $2}' /tmp/rule-severities.tsv | head -1)
              sev=${sev:-0}
              if awk -v s="$sev" 'BEGIN { exit !(s >= 7.0) }'; then
                echo "::error::$f: finding with security-severity $sev (rule $rule_id) is High/Critical"
                FAIL=1
              fi
            done < /tmp/result-rules.txt
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "High/critical CodeQL findings present -- see annotations above."
            exit 1
          fi
          echo "No High/Critical CodeQL findings."

  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    container:
      image: semgrep/semgrep:1.185.0
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No continue-on-error: semgrep's exit code is 0 regardless of findings unless --error is
      # passed, so a non-zero exit here means a real tool failure (e.g. couldn't fetch p/ci).
      - name: Run Semgrep
        run: semgrep scan --config=p/ci --sarif --output=semgrep.sarif

      - name: Upload Semgrep report (Security tab)
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      # Each result's own "level" is null -- severity lives on the rule at
      # tool.driver.rules[].defaultConfiguration.level, same join pattern as CodeQL. ERROR is
      # Semgrep's top severity tier (no separate High/Critical), used as the equivalent.
      - name: Fail on ERROR-severity Semgrep findings
        run: |
          jq -r '
            [(.runs[].tool.driver.rules[]? ), (.runs[].tool.extensions[]?.rules[]?)]
            | .[] | [.id, (.defaultConfiguration.level // "none")] | @tsv
          ' semgrep.sarif > /tmp/rule-levels.tsv
          jq -r '.runs[].results[]? | .ruleId' semgrep.sarif > /tmp/result-rules.txt

          FAIL=0
          while IFS= read -r rule_id; do
            [ -z "$rule_id" ] && continue
            level=$(awk -F'\t' -v r="$rule_id" '$1 == r {print $2}' /tmp/rule-levels.tsv | head -1)
            if [ "$level" = "error" ]; then
              echo "::error::Semgrep finding (rule $rule_id, level error) is High/Critical-equivalent"
              FAIL=1
            fi
          done < /tmp/result-rules.txt

          if [ "$FAIL" -eq 1 ]; then
            echo "ERROR-severity Semgrep findings present -- see the Security tab."
            exit 1
          fi
          echo "No ERROR-severity Semgrep findings."

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run TruffleHog (filesystem scan, fail on any verified secret)
        run: |
         docker run --rm -v ${{ github.workspace }}:/repo ghcr.io/trufflesecurity/trufflehog:3.99.9 \
         filesystem /repo --fail --only-verified
